<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국성티처</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#802020',
                        'primary-hover': '#601818',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Pretendard Variable', sans-serif; }
        main { zoom: 1.25; }
        .student-block { transition: all 0.15s; }
        .horizontal-scroll-container::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .horizontal-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .horizontal-scroll-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#F7F7F5] text-[#1c1b1b]">

    <div id="login-screen" class="flex items-center justify-center min-h-screen bg-[#F7F7F5]">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-zinc-200 w-96 text-center">
            <h1 class="text-2xl font-bold text-primary mb-2 tracking-tight">국성티처</h1>
            <p class="text-zinc-500 mb-6 text-sm">중·고등부 학원 관리 시스템 로그인</p>
            <div class="space-y-4">
                <input type="password" id="login-input" placeholder="전화번호 뒷4자리" maxlength="20" 
                    onkeydown="if(event.key === 'Enter') handleLogin()"
                    class="w-full px-4 py-3 border border-zinc-300 rounded-xl text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                <button onclick="handleLogin()" class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-primary-hover transition">
                    로그인
                </button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <header class="bg-white border-b border-zinc-200 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center space-x-4">
                <h1 class="text-xl font-bold text-primary tracking-tighter">국성티처</h1>
                <span id="user-badge" class="px-3 py-1 bg-[#802020]/10 text-primary rounded-full text-sm font-medium">강사 모드</span>
                
                <div id="admin-selector-wrapper" class="hidden flex items-center space-x-2">
                    <label class="text-sm text-zinc-600">보기 모드:</label>
                    <select id="teacher-select" onchange="changeTeacher(this.value)" class="border border-zinc-300 rounded-lg px-3 py-1 text-sm bg-zinc-50 focus:outline-none focus:ring-1 focus:ring-primary">
                        <option value="통합출석부">🌟 전체 통합 출석부 (관리자 전용)</option>
                        <option value="황성웅">황성웅T</option>
                        <optgroup label="중등부">
                            <option value="정다운">정다운T</option>
                            <option value="김신형">김신형T</option>
                            <option value="문지현">문지현T</option>
                        </optgroup>
                        <optgroup label="고등부">
                            <option value="강윤지">강윤지T</option>
                            <option value="이현영">이현영T</option>
                            <option value="김명일">김명일T</option>
                            <option value="김준영">김준영T</option>
                            <option value="박신언">박신언T</option>
                            <option value="윤태민">윤태민T</option>
                            <option value="고광준">고광준T</option>
                            <option value="이영찬">이영찬T</option>
                            <option value="오세현">오세현T</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="flex items-center space-x-6">
                <nav class="space-x-2">
                    <button onclick="switchTab('attendance')" id="tab-attendance-btn" class="px-4 py-2 rounded-lg font-semibold bg-primary text-white transition">출석부</button>
                    <button onclick="switchTab('management')" id="tab-management-btn" class="px-4 py-2 rounded-lg font-semibold text-zinc-600 hover:bg-zinc-100 transition">원생 관리</button>
                    <button onclick="switchTab('admin-reservations')" id="tab-admin-reservations-btn" class="px-4 py-2 rounded-lg font-semibold text-zinc-600 hover:bg-zinc-100 transition">전송 예약 관리</button>
                </nav>
                <button onclick="handleLogout()" class="text-sm text-red-500 hover:underline">로그아웃</button>
            </div>
        </header>

        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            
            <section id="tab-attendance" class="space-y-6">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-zinc-200">
                    <div>
                        <h2 class="text-xl font-bold text-zinc-800" id="attendance-title">출석부</h2>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="flex items-center space-x-2">
                            <label class="text-xs font-semibold text-zinc-600">학생 검색:</label>
                            <input type="text" id="attendance-search-input" oninput="handleAttendanceSearch(this.value)" placeholder="이름 검색..." class="border border-zinc-300 rounded-xl px-3 py-1.5 text-sm bg-zinc-50 focus:outline-none focus:ring-1 focus:ring-primary w-32">
                        </div>
                        <div class="flex items-center space-x-2">
                            <label class="text-xs font-semibold text-zinc-600">조회 주차:</label>
                            <select id="week-select" onchange="changeWeek(this.value)" class="border border-zinc-300 rounded-xl px-3 py-1.5 text-sm bg-zinc-50 focus:outline-none focus:ring-1 focus:ring-primary font-bold text-primary">
                                </select>
                        </div>
                        <div id="slot-add-btn-wrapper">
                            <button onclick="addSlotBoxPrompt()" class="bg-zinc-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-zinc-900 transition">
                                + 시간대 박스 추가
                            </button>
                        </div>
                    </div>
                </div>

                <div class="space-y-8" id="timetable-container">
                    
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                            <h3 class="text-primary font-extrabold text-lg" id="label-friday">금요일</h3>
                            <button id="btn-add-friday" onclick="addSlotBox('friday')" class="text-xs bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-3 py-1.5 rounded-lg font-semibold transition">+ 시간대 박스 추가</button>
                        </div>
                        <div id="row-friday" class="w-full"></div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                            <h3 class="text-primary font-extrabold text-lg" id="label-saturday">토요일</h3>
                            <button id="btn-add-saturday" onclick="addSlotBox('saturday')" class="text-xs bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-3 py-1.5 rounded-lg font-semibold transition">+ 시간대 박스 추가</button>
                        </div>
                        <div id="row-saturday" class="w-full"></div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-zinc-100">
                            <h3 class="text-primary font-extrabold text-lg" id="label-sunday">일요일</h3>
                            <button id="btn-add-sunday" onclick="addSlotBox('sunday')" class="text-xs bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-3 py-1.5 rounded-lg font-semibold transition">+ 시간대 박스 추가</button>
                        </div>
                        <div id="row-sunday" class="w-full"></div>
                    </div>

                </div>
            </section>

            <section id="tab-management" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-[#1c1b1b]" id="management-title">원생 관리 및 카카오톡 전송 예약</h2>
                        <p class="text-sm text-zinc-500">원생을 선택하고 전송할 내용을 작성한 뒤 예약 설정을 진행하세요.</p>
                    </div>
                    <div class="space-x-2 flex items-center">
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handleExcelUpload(event)">
                        <button onclick="document.getElementById('excel-file-input').click()" class="bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-emerald-800 transition">
                            📁 통통통 엑셀 일괄 등록
                        </button>
                        <input type="file" id="phone-excel-file-input" accept=".xlsx, .xls, .csv" style="display: none;" onchange="handlePhoneExcelUpload(event)">
                        <button onclick="document.getElementById('phone-excel-file-input').click()" class="bg-sky-700 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-sky-800 transition">
                            ☎️ 전화번호 일괄 업데이트
                        </button>
                        <button onclick="openAddStudentModal()" class="bg-zinc-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-zinc-900 transition">+ 원생 신규 등록</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                    <div class="md:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-zinc-200 space-y-3">
                        <div class="pb-2 border-b border-zinc-100 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-zinc-800">전체 원생 목록 (가나다순)</span>
                                <span class="text-xs text-zinc-400" id="selected-count">0건 선택됨</span>
                            </div>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[11px] text-zinc-500 shrink-0">전체 선택:</span>
                                <button onclick="selectAllRecipients('student')" class="text-[11px] bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-2.5 py-1 rounded-lg font-semibold transition">학생</button>
                                <button onclick="selectAllRecipients('parent')" class="text-[11px] bg-zinc-100 hover:bg-zinc-200 text-zinc-700 px-2.5 py-1 rounded-lg font-semibold transition">학부모</button>
                                <button onclick="selectAllRecipients('none')" class="text-[11px] text-zinc-400 hover:text-rose-600 px-2 py-1 rounded-lg font-semibold transition">선택 해제</button>
                            </div>
                        </div>
                        <div class="pb-1">
                            <input type="text" id="management-search-input" oninput="handleManagementSearch(this.value)" placeholder="이름으로 검색..." class="w-full border border-zinc-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-1 focus:ring-primary">
                        </div>
                        <div id="management-student-list" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
                    </div>

                    <div class="md:col-span-7 bg-white p-6 rounded-2xl shadow-sm border border-zinc-200 space-y-5">
                        <h3 class="font-bold text-base text-zinc-800 border-b border-zinc-100 pb-2">카카오톡 전송 내용 작성</h3>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-zinc-600">발송 메시지 내용</label>
                            <textarea id="kakao-msg-content" rows="7" 
                                class="w-full border border-zinc-200 rounded-xl p-3 focus:outline-none focus:ring-1 focus:ring-primary text-sm resize-none" 
                                placeholder="학부모님/학생에게 전달할 알림톡 내용을 입력하세요..."></textarea>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-semibold text-zinc-600">예약 일시 선택</label>
                            <div class="grid grid-cols-2 gap-3">
                                <input type="date" id="reserve-date" class="border border-zinc-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary text-zinc-700">
                                <input type="time" id="reserve-time" class="border border-zinc-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary text-zinc-700">
                            </div>
                        </div>
                        <button onclick="handleKakaoReservation()" class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-primary-hover transition shadow-sm">
                            전송 예약하기
                        </button>
                    </div>
                </div>
            </section>

            <section id="tab-admin-reservations" class="hidden space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-zinc-800" id="admin-res-page-title">카카오톡 전송 예약 관리</h2>
                    <p class="text-sm text-zinc-500" id="admin-res-page-desc">신청한 예약 내역을 확인하고 자동화 프로그램 연동 상태를 관리합니다.</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-zinc-200">
                    <div id="admin-reservation-list" class="space-y-4"></div>
                </div>
            </section>

        </main>
    </div>

    <div id="move-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onclick="if(event.target===this) closeMoveModal()">
        <div class="bg-white rounded-2xl shadow-lg w-full max-w-md max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-zinc-100">
                <h3 class="font-bold text-base text-zinc-800">시간표 등록 관리 - <span id="move-modal-student-name" class="text-primary"></span></h3>
                <button onclick="closeMoveModal()" class="text-zinc-400 hover:text-zinc-700 text-xl leading-none">&times;</button>
            </div>
            <p class="px-4 pt-3 text-xs text-zinc-500">체크된 시간대에 학생이 등록됩니다. 여러 개를 선택하면 여러 시간표에 동시 등록됩니다.</p>
            <div class="px-4 pt-3 space-y-1.5 bg-zinc-50 mx-4 rounded-xl p-3 border border-zinc-200">
                <label class="flex items-start space-x-2 cursor-pointer">
                    <input type="radio" name="move-scope" value="week" id="move-scope-week" checked class="mt-0.5 w-4 h-4 text-primary focus:ring-primary">
                    <span class="text-xs text-zinc-700"><b>이번 주차(<span id="move-modal-week-label" class="text-primary font-semibold"></span>)만 임시 이동</b><br><span class="text-[11px] text-zinc-500">다음 주차부터는 자동으로 기본 시간표대로 돌아갑니다.</span></span>
                </label>
                <label class="flex items-start space-x-2 cursor-pointer">
                    <input type="radio" name="move-scope" value="default" id="move-scope-default" class="mt-0.5 w-4 h-4 text-primary focus:ring-primary">
                    <span class="text-xs text-zinc-700"><b>기본 시간표 자체를 변경</b><br><span class="text-[11px] text-zinc-500">앞으로 매 주차 이 시간표로 계속 생성됩니다.</span></span>
                </label>
                <button id="move-modal-clear-override-btn" onclick="clearMoveModalOverride()" class="hidden text-[11px] text-rose-600 hover:underline font-semibold pt-1">이번 주 임시 설정 초기화 (기본 시간표로 복원)</button>
            </div>
            <div id="move-modal-slot-list" class="p-4 space-y-4 overflow-y-auto"></div>
            <div class="flex justify-end space-x-2 p-4 border-t border-zinc-100">
                <button onclick="closeMoveModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-zinc-600 hover:bg-zinc-100 transition">취소</button>
                <button onclick="saveMoveModalSelection()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-primary text-white hover:bg-primary-hover transition">저장</button>
            </div>
        </div>
    </div>

    <div id="student-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onclick="if(event.target===this) closeStudentModal()">
        <div class="bg-white rounded-2xl shadow-lg w-full max-w-lg max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-zinc-100">
                <h3 class="font-bold text-base text-zinc-800" id="student-modal-title">원생 신규 등록</h3>
                <button onclick="closeStudentModal()" class="text-zinc-400 hover:text-zinc-700 text-xl leading-none">&times;</button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-zinc-600">이름 *</label>
                        <input type="text" id="student-modal-name" placeholder="예: 홍길동" class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-zinc-600">학교/소속</label>
                        <input type="text" id="student-modal-school" placeholder="예: 청람중1" class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-zinc-600">학생 전화번호</label>
                        <input type="text" id="student-modal-phone" placeholder="010-1234-5678" class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-zinc-600">학부모 전화번호</label>
                        <input type="text" id="student-modal-parent-phone" placeholder="010-1234-5678" class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-600">시간표 배치 (여러 개 선택 가능)</label>
                    <div id="student-modal-slot-list" class="space-y-3 border border-zinc-200 rounded-xl p-3 max-h-56 overflow-y-auto bg-zinc-50/50"></div>
                </div>
            </div>
            <div class="flex justify-end space-x-2 p-4 border-t border-zinc-100">
                <button onclick="closeStudentModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-zinc-600 hover:bg-zinc-100 transition">취소</button>
                <button onclick="saveStudentModal()" class="px-4 py-2 rounded-lg text-sm font-semibold bg-primary text-white hover:bg-primary-hover transition">저장</button>
            </div>
        </div>
    </div>

        async function loadDataFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('app_data').select('*');
                if (error) {
                    console.error("Supabase 로드 오류:", error);
                    return;
                }
                if (data && data.length > 0) {
                    data.forEach(row => {
                        if (row.id === 'teacherDataStore') teacherDataStore = row.data;
                        if (row.id === 'attendanceRecords') attendanceRecords = row.data;
                        if (row.id === 'globalReservations') globalReservations = row.data;

            }

        async function saveDataToSupabase(key, payload) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('app_data').upsert({
                    id: key,
                    data: payload,
                    updated_at: new Date()
                });
            } catch (err) {
                console.error("Supabase 저장 오류:", err);
            }
        }

        function initWeeks() {
            const weekSelect = document.getElementById("week-select");
            if (!weekSelect) return;
            weekSelect.innerHTML = "";
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const dayOfWeek = today.getDay(); 
            // 금/토/일이 한 "주차"를 이룸: 일요일(0)은 어제(토요일)가 속한 주차를 가리켜야 하고,
            // 월~목은 다가오는 주말 주차를, 금/토는 이번 주말 주차를 가리켜야 함.
            let diffToSaturday = (dayOfWeek === 0) ? -1 : 6 - dayOfWeek;
            
            const currentSaturday = new Date(today);
            currentSaturday.setDate(today.getDate() + diffToSaturday);
            currentSaturday.setHours(0, 0, 0, 0);

            const baseStartDate = new Date("2026-08-22"); 
            baseStartDate.setHours(0, 0, 0, 0);

            let diffTime = currentSaturday.getTime() - baseStartDate.getTime();
            let diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            if (diffWeeks < 0) diffWeeks = 0;

            let defaultSelectedWeekKey = "";

            for (let i = 0; i <= diffWeeks; i++) {
                let satDateObj = new Date(baseStartDate);
                satDateObj.setDate(baseStartDate.getDate() + (i * 7));
                
                let saturdayDate = getFormattedDate(satDateObj);
                let fridayDate = getFormattedDate(new Date(satDateObj.getTime() - 86400000));
                let sundayDate = getFormattedDate(new Date(satDateObj.getTime() + 86400000));
                
                let weekKey = `${saturdayDate} 주차`;
                let option = document.createElement("option");
                option.value = weekKey;
                option.setAttribute('data-fri', fridayDate);
                option.setAttribute('data-sat', saturdayDate);
                option.setAttribute('data-sun', sundayDate);
                option.innerText = `${weekKey} (토:${saturdayDate.slice(5)})`;
                
                weekSelect.appendChild(option);

                if (i === diffWeeks) {
                    option.selected = true;
                    defaultSelectedWeekKey = weekKey;
                }
            }

            currentSelectedWeek = defaultSelectedWeekKey;
            updateSectionDateLabels();
        }

            let year = dateObj.getFullYear();
            let month = String(dateObj.getMonth() + 1).padStart(2, '0');
            let day = String(dateObj.getDate()).padStart(2, '0');

        function updateSectionDateLabels() {
            const selectElem = document.getElementById("week-select");
            if (!selectElem || selectElem.selectedIndex === -1) return;
            const selectedOpt = selectElem.options[selectElem.selectedIndex];
            
            const fri = selectedOpt.getAttribute('data-fri');

        // ===== 다중 시간표 등록 지원 헬퍼 =====
        function getStudentSlotIds(student) {
            if (Array.isArray(student.slotIds)) return student.slotIds.slice();
            if (student.slotId) return [student.slotId];
            return [];
        }

        // ===== 강사별 기본 시간표 vs 주차별 임시 이동 =====
        function getWeeklyOverride(teacherName, studentName, weekKey) {
            const wk = weeklyOverrides[weekKey];
            if (!wk || !wk[teacherName]) return null;
            return wk[teacherName][studentName] || null;
        }

        function hasWeeklyOverride(teacherName, studentName, weekKey) {
            return !!getWeeklyOverride(teacherName, studentName, weekKey);
        }

        function setWeeklyOverride(teacherName, studentName, weekKey, slotIds) {
            if (!weeklyOverrides[weekKey]) weeklyOverrides[weekKey] = {};
            if (!weeklyOverrides[weekKey][teacherName]) weeklyOverrides[weekKey][teacherName] = {};
            weeklyOverrides[weekKey][teacherName][studentName] = { slotIds: slotIds.slice() };
            saveDataToSupabase('weeklyOverrides', weeklyOverrides);
        }

        function clearWeeklyOverride(teacherName, studentName, weekKey) {
            const wk = weeklyOverrides[weekKey];
            if (wk && wk[teacherName] && wk[teacherName][studentName]) {
                delete wk[teacherName][studentName];
                saveDataToSupabase('weeklyOverrides', weeklyOverrides);
            }
        }

        // 해당 주차에 실제로 표시될 시간대 ID 목록 (임시 이동이 있으면 그것을, 없으면 강사별 기본 시간표를 반환)
        function getEffectiveSlotIds(teacherName, student, weekKey) {
            const override = getWeeklyOverride(teacherName, student.name, weekKey);
            if (override) return override.slotIds.slice();
            return getStudentSlotIds(student);
        }

        function parseSlotChoiceInput(input, allSlots) {
            const parts = input.split(/[,，\s]+/).map(p => p.trim()).filter(p => p !== "");
            const ids = [];
            parts.forEach(p => {
                const idx = parseInt(p, 10) - 1;
                if (!isNaN(idx) && allSlots[idx] && !ids.includes(allSlots[idx].id)) {
                    ids.push(allSlots[idx].id);
                }
            });
            return ids;
        }

        function openMoveModal(studentName, teacherName) {

            document.getElementById("move-modal-student-name").innerText = `${studentName} (${teacherName}T)`;
            document.getElementById("move-modal-week-label").innerText = currentSelectedWeek;

            const student = data.students.find(s => s.name === studentName);
            const isTemp = student ? hasWeeklyOverride(teacherName, studentName, currentSelectedWeek) : false;
            const currentSlotIds = student ? getEffectiveSlotIds(teacherName, student, currentSelectedWeek) : [];

            document.getElementById("move-scope-week").checked = true;
            document.getElementById("move-scope-default").checked = false;
            document.getElementById("move-modal-clear-override-btn").classList.toggle("hidden", !isTemp);

            const dayNameKo = { friday: '금요일', saturday: '토요일', sunday: '일요일' };
            const listContainer = document.getElementById("move-modal-slot-list");
            listContainer.innerHTML = "";

            let hasAnySlot = false;
            ['friday', 'saturday', 'sunday'].forEach(day => {
                const daySlots = getSortedSlots(data.slots[day] || []);
                if (daySlots.length === 0) return;
                hasAnySlot = true;

                const dayBlock = document.createElement("div");
                const dayTitle = document.createElement("div");
                dayTitle.className = "text-xs font-bold text-zinc-500 mb-1.5";
                dayTitle.innerText = dayNameKo[day];
                dayBlock.appendChild(dayTitle);

                const slotWrap = document.createElement("div");
                slotWrap.className = "space-y-1.5";

                daySlots.forEach(slot => {
                    const isChecked = currentSlotIds.includes(slot.id);
                    const label = document.createElement("label");
                    label.className = "flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-semibold border border-zinc-200 bg-zinc-50 hover:border-primary cursor-pointer transition";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = slot.id;
                    checkbox.checked = isChecked;
                    checkbox.className = "move-modal-slot-checkbox w-4 h-4 text-primary rounded border-zinc-300 focus:ring-primary";

                    const textSpan = document.createElement("span");
                    textSpan.className = "text-zinc-700";
                    textSpan.innerText = slot.title;

                    label.appendChild(checkbox);
                    label.appendChild(textSpan);
                    slotWrap.appendChild(label);
                });

                dayBlock.appendChild(slotWrap);
                listContainer.appendChild(dayBlock);
            });

            if (!hasAnySlot) {
                listContainer.innerHTML = '<div class="text-xs text-zinc-400 text-center py-6">등록할 수 있는 시간대 박스가 없습니다.</div>';
            }

            document.getElementById("move-modal").classList.remove("hidden");
        }

        function closeMoveModal() {
            document.getElementById("move-modal").classList.add("hidden");
            moveModalStudentName = null;
            moveModalTeacherName = null;
        }

        function saveMoveModalSelection() {
            if (!moveModalStudentName || !moveModalTeacherName) return;
            const data = teacherDataStore[moveModalTeacherName];
            if (!data) return;

            const student = data.students.find(s => s.name === moveModalStudentName);
            if (!student) return;

            const checkedIds = Array.from(document.querySelectorAll('.move-modal-slot-checkbox:checked')).map(cb => cb.value);

            if (checkedIds.length === 0) {
                alert("최소 1개 이상의 시간대를 선택해야 합니다.");
                return;
            }

            const scope = document.querySelector('input[name="move-scope"]:checked').value;

            if (scope === 'week') {
                // 이번 주차에만 임시로 반영. 강사의 기본 시간표(student.slotIds)는 그대로 유지되어 다음 주차부터 자동 복원됨.
                setWeeklyOverride(moveModalTeacherName, moveModalStudentName, currentSelectedWeek, checkedIds);
            } else {
                // 기본 시간표 자체를 변경. 이번 주차에 걸려있던 임시 이동 기록은 정리한다.
                student.slotIds = checkedIds;
                delete student.slotId;
                clearWeeklyOverride(moveModalTeacherName, moveModalStudentName, currentSelectedWeek);
                sortStudentsAlphabetically(moveModalTeacherName);
                saveDataToSupabase('teacherDataStore', teacherDataStore);
            }

            const currentTeacher = getCurrentActiveTeacher();
            if (currentTeacher === "통합출석부") {
                renderIntegratedTimetable();
            } else {
                renderTimetableAndSlots(moveModalTeacherName);
            }

            closeMoveModal();
        }

        function clearMoveModalOverride() {
            if (!moveModalStudentName || !moveModalTeacherName) return;
            if (!confirm("이번 주차의 임시 시간표 설정을 지우고 기본 시간표로 되돌리시겠습니까?")) return;

            clearWeeklyOverride(moveModalTeacherName, moveModalStudentName, currentSelectedWeek);

            const currentTeacher = getCurrentActiveTeacher();
            if (currentTeacher === "통합출석부") {
                renderIntegratedTimetable();
            } else {
                renderTimetableAndSlots(moveModalTeacherName);
            }
            closeMoveModal();
        }

                document.getElementById("teacher-select").value = targetValue;
            }

            if (!teacherDataStore[targetValue]) {
                initDefaultTeacherData(targetValue);
            }

            sortStudentsAlphabetically(targetValue);
            renderFullApp(targetValue);
        }

        function sortStudentsAlphabetically(teacherName) {
            if (teacherDataStore[teacherName] && teacherDataStore[teacherName].students) {
                teacherDataStore[teacherName].students.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
            }
        }

        function parseSlotTime(title) {
            if (!title) return 9999;
            let match = title.match(/(오전|오후)\s*(\d{1,2})시/);
            if (!match) {
                match = title.match(/(\d{1,2})시/);
                if (!match) return 9999;
                let hour = parseInt(match[1], 10);
                return hour < 9 ? hour + 12 : hour;
            }
            let isPm = match[1] === '오후';
            let hour = parseInt(match[2], 10);
            if (isPm && hour < 12) hour += 12;
            if (!isPm && hour === 12) hour = 0;
            return hour;
        }

        function getSortedSlots(slotsArray) {
            if (!slotsArray) return [];
            return [...slotsArray].sort((a, b) => parseSlotTime(a.title) - parseSlotTime(b.title));
        }

        function initDefaultTeacherData(teacherName) {
            teacherDataStore[teacherName] = {
                slots: { friday: [], saturday: [], sunday: [] },
                students: []
            };
        }

        function renderFullApp(teacherName) {
            sortStudentsAlphabetically(teacherName);
            renderTimetableAndSlots(teacherName);
            renderManagementStudents(teacherName);
        }

        function getRecordKey(studentName, slotId) {
            return `${studentName}__${slotId}`;
        }

        function getStudentRecord(studentName, slotId) {
            if (!attendanceRecords[currentSelectedWeek]) {
                attendanceRecords[currentSelectedWeek] = {};
            }
            const key = getRecordKey(studentName, slotId);
            if (!attendanceRecords[currentSelectedWeek][key]) {
                // 시간표별 개별 기록 도입 전 데이터(학생 이름만으로 저장된 기록)가 있으면 초기값으로 승계
                const legacy = attendanceRecords[currentSelectedWeek][studentName];
                attendanceRecords[currentSelectedWeek][key] = legacy
                    ? { status: legacy.status, memo: legacy.memo }
                    : { status: '출석', memo: '' };
            }
            return attendanceRecords[currentSelectedWeek][key];
        }

        function updateStudentStatus(studentName, slotId, status) {
            const rec = getStudentRecord(studentName, slotId);
            rec.status = status;
            saveDataToSupabase('attendanceRecords', attendanceRecords);
        }

        function updateStudentMemo(studentName, slotId, memoText) {
            const rec = getStudentRecord(studentName, slotId);
            rec.memo = memoText;
            saveDataToSupabase('attendanceRecords', attendanceRecords);
        }

                        teacherColumns.push({ tName, daySlots, tData });

                                        <button onclick="handleStatusClick('${s.name}', '${slot.id}', '결석', this)" class="px-2 py-0.5 text-[11px] rounded ${absBtnClass} status-btn">결석</button>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <input type="text" placeholder="비고" value="${rec.memo}" 
                                            oninput="updateStudentMemo('${s.name}', '${slot.id}', this.value)"
                                            class="w-full text-[11px] border border-zinc-200 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-primary text-zinc-700 bg-white">
                                    </div>
                                </div>
                            `;
                        });

                        if (studentsHtml === "") {
                            studentsHtml = '<div class="text-[11px] text-zinc-400 text-center py-2">학생 없음</div>';
                        }

                        cardsHtml += `
                            <div class="bg-zinc-50/50 p-4 rounded-xl border border-zinc-200" style="grid-column: ${colIdx + 1}; grid-row: ${slotIdx + 1};">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xs font-bold text-zinc-700 truncate"><span class="text-primary">[${tName}T]</span> ${slot.title}</span>
                                </div>
                                <div class="space-y-1.5">${studentsHtml}</div>
                            </div>
                        `;
                    });
                });

                const gridStyle = `grid-template-columns: repeat(${teacherColumns.length}, 380px); grid-auto-rows: auto;`;

                rowContainer.innerHTML = `

        function selectAllRecipients(mode) {
            const visibleRows = Array.from(document.querySelectorAll('#management-student-list [data-student-name]'))
                .filter(row => row.style.display !== 'none');

            visibleRows.forEach(row => {
                const studentCb = row.querySelector('.recipient-checkbox[data-type="student"]');
                const parentCb = row.querySelector('.recipient-checkbox[data-type="parent"]');

                if (mode === 'none') {
                    if (studentCb) studentCb.checked = false;
                    if (parentCb) parentCb.checked = false;
                    return;
                }

                if (mode === 'student' && studentCb && !studentCb.disabled) {
                    studentCb.checked = true;
                }
                if (mode === 'parent' && parentCb && !parentCb.disabled) {
                    parentCb.checked = true;
                }
            });

            updateSelectedCount();
        }

        function openStudentModal(mode, teacherName, index) {
            const data = teacherDataStore[teacherName];
            if (!data) return;

            studentModalMode = mode;
            studentModalTeacherName = teacherName;
            studentModalEditIndex = (mode === 'edit') ? index : null;

            document.getElementById("student-modal-title").innerText = mode === 'edit'
                ? `원생 정보 수정 - ${student.name} (${teacherName}T)`
                : `원생 신규 등록 (${teacherName}T)`;

            document.getElementById("student-modal-name").value = student ? student.name : "";
            document.getElementById("student-modal-school").value = student ? student.school : "";
            document.getElementById("student-modal-phone").value = student ? (student.phone || "") : "";
            document.getElementById("student-modal-parent-phone").value = student ? (student.parentPhone || "") : "";

            const currentSlotIds = student ? getStudentSlotIds(student) : [];
            const dayNameKo = { friday: '금요일', saturday: '토요일', sunday: '일요일' };
            const listContainer = document.getElementById("student-modal-slot-list");
            listContainer.innerHTML = "";

            let hasAnySlot = false;
            ['friday', 'saturday', 'sunday'].forEach(day => {
                const daySlots = getSortedSlots(data.slots[day] || []);
                if (daySlots.length === 0) return;
                hasAnySlot = true;

                const dayBlock = document.createElement("div");
                const dayTitle = document.createElement("div");
                dayTitle.className = "text-xs font-bold text-zinc-500 mb-1.5";
                dayTitle.innerText = dayNameKo[day];
                dayBlock.appendChild(dayTitle);

        function handleExcelUpload(event) {
    const currentTeacher = getCurrentActiveTeacher();
    if (currentTeacher === "통합출석부") {
        alert("통합출석부 모드에서는 원생을 등록할 수 없습니다. 특정 강사를 선택한 후 업로드해주세요.");
        event.target.value = "";
        return;
    }

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            if (jsonRows.length === 0) {
                alert("엑셀 파일에 데이터가 없습니다.");
                return;
            }

            let headerRowIdx = 0;
            let nameColIdx = -1;
            let schoolColIdx = -1;

            // 헤더 위치 및 이름/학교학년 컬럼 탐색
            for (let i = 0; i < Math.min(jsonRows.length, 5); i++) {
                let row = jsonRows[i];
                for (let j = 0; j < row.length; j++) {
                    let cellVal = String(row[j] || "").trim();
                    if (cellVal.includes("이름") || cellVal.includes("학생명")) nameColIdx = j;
                    if (cellVal.includes("학교") || cellVal.includes("소속") || cellVal.includes("학년")) schoolColIdx = j;
                }
                if (nameColIdx !== -1) {
                    headerRowIdx = i;
                    break;
                }
            }

            if (nameColIdx === -1) {
                nameColIdx = 0; 
                schoolColIdx = 1;
                headerRowIdx = 0;
            } else {
                headerRowIdx += 1;
            }

            if (!teacherDataStore[currentTeacher]) initDefaultTeacherData(currentTeacher);
            const tData = teacherDataStore[currentTeacher];

            // 강사의 전체 시간대(반) 목록 수집
            let allTeacherSlots = [];
            ['friday', 'saturday', 'sunday'].forEach(day => {
                if (tData.slots[day]) {
                    allTeacherSlots = allTeacherSlots.concat(tData.slots[day]);
                }
            });

            // 매칭 가능한 박스가 하나도 없으면 기본 박스 생성
            if (allTeacherSlots.length === 0) {
                const defaultSlotId = 'slot-saturday-' + Date.now();
                const defaultSlot = { id: defaultSlotId, title: '정규반 (일괄등록)' };
                tData.slots.saturday.push(defaultSlot);
                allTeacherSlots.push(defaultSlot);
            }

            let addedCount = 0;
            let matchedCount = 0;

            for (let i = headerRowIdx; i < jsonRows.length; i++) {
                let row = jsonRows[i];
                if (!row || row.length === 0) continue;

                let name = String(row[nameColIdx] || "").trim();
                if (!name || name === "이름" || name === "학생명") continue;

                let school = schoolColIdx !== -1 && row[schoolColIdx] ? String(row[schoolColIdx]).trim() : "통통통등록";

                let exists = tData.students.some(s => s.name === name);
                if (!exists) {
                    // 학교/학년 이름이 출석부 박스 제목에 포함되어 있는지 자동 검색 매칭
                    let matchedSlot = allTeacherSlots.find(slot => {
                        return school !== "통통통등록" && slot.title.includes(school);
                    });

                    let targetSlotId = "";
                    if (matchedSlot) {
                        targetSlotId = matchedSlot.id;
                        matchedCount++;
                    } else {
                        // 일치하는 반이 없을 경우 첫 번째 시간대 박스로 기본 배치
                        targetSlotId = allTeacherSlots[0].id;
                    }

                    tData.students.push({
                        name: name,
                        school: school,
                        slotIds: [targetSlotId]
                    });
                    addedCount++;
                }
            }

            renderFullApp(currentTeacher);
            saveDataToSupabase('teacherDataStore', teacherDataStore);
            alert(`[일괄 등록 완료]\n총 ${addedCount}명의 원생 등록 완료!\n(학교/학년 자동 매칭 배치: ${matchedCount}명)`);

        } catch (err) {
            console.error(err);
            alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
        } finally {
            event.target.value = "";
        }
    };
    reader.readAsArrayBuffer(file);
}

        function handlePhoneExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonRows.length === 0) {
                        alert("엑셀 파일에 데이터가 없습니다.");
                        return;
                    }

                    let headerRowIdx = 0;
                    let nameColIdx = -1;
                    let schoolColIdx = -1;
                    let phoneColIdx = -1;
                    let parentPhoneColIdx = -1;

                    // 헤더 위치 및 이름/학교/전화번호/학부모번호 컬럼 탐색
                    for (let i = 0; i < Math.min(jsonRows.length, 5); i++) {
                        let row = jsonRows[i];
                        for (let j = 0; j < row.length; j++) {
                            let cellVal = String(row[j] || "").trim();
                            if (cellVal.includes("이름") || cellVal.includes("학생명")) nameColIdx = j;
                            if (cellVal.includes("학교") || cellVal.includes("소속") || cellVal.includes("학년")) schoolColIdx = j;
                            // '학부모/보호자/부모' 가 포함된 헤더는 학부모 번호로, 나머지 번호/연락처/전화 헤더는 학생 번호로 인식
                            if (cellVal.includes("학부모") || cellVal.includes("보호자") || cellVal.includes("부모")) {
                                parentPhoneColIdx = j;
                            } else if (cellVal.includes("번호") || cellVal.includes("연락처") || cellVal.includes("전화") || cellVal.toLowerCase().includes("phone")) {
                                phoneColIdx = j;
                            }
                        }
                        if (nameColIdx !== -1 && (phoneColIdx !== -1 || parentPhoneColIdx !== -1)) {
                            headerRowIdx = i;
                            break;
                        }
                    }

                    if (nameColIdx === -1 || (phoneColIdx === -1 && parentPhoneColIdx === -1)) {
                        alert("엑셀에서 '이름'과 '전화번호(연락처)' 또는 '학부모 번호' 컬럼을 찾을 수 없습니다. 헤더 행을 확인해주세요.");
                        return;
                    }
                    headerRowIdx += 1;

                    let matchedCount = 0;
                    let notFoundNames = [];
                    let skippedAmbiguous = [];

                    for (let i = headerRowIdx; i < jsonRows.length; i++) {
                        let row = jsonRows[i];
                        if (!row || row.length === 0) continue;

                        let name = String(row[nameColIdx] || "").trim();
                        if (!name || name === "이름" || name === "학생명") continue;

                        let school = schoolColIdx !== -1 && row[schoolColIdx] ? String(row[schoolColIdx]).trim() : "";
                        let phone = phoneColIdx !== -1 && row[phoneColIdx] ? String(row[phoneColIdx]).trim() : "";
                        let parentPhone = parentPhoneColIdx !== -1 && row[parentPhoneColIdx] ? String(row[parentPhoneColIdx]).trim() : "";
                        if (!phone && !parentPhone) continue;

                        // 강사(반) 구분과 무관하게, 전체 데이터에서 이름이 같은 원생을 모두 모아
                        // 동명이인 여부를 먼저 판별한다. (반이 달라도 동명이인은 동명이인!)
                        let globalCandidates = [];
                        for (let tName in teacherDataStore) {
                            const tData = teacherDataStore[tName];
                            if (!tData || !tData.students) continue;
                            tData.students.forEach(s => {
                                if (s.name === name) globalCandidates.push(s);
                            });
                        }

                        let targets = globalCandidates;

                        if (globalCandidates.length > 1) {
                            // 동명이인이 있는 경우, 학교 정보로 정확히 구분되는 원생에게만 반영한다.
                            // (공백 차이로 인한 오매칭 방지를 위해 공백을 제거하고 비교)
                            if (school) {
                                const normalize = (str) => String(str || "").replace(/\s+/g, "");
                                targets = globalCandidates.filter(s => normalize(s.school) === normalize(school));
                            } else {
                                targets = [];
                            }

                            if (targets.length === 0) {
                                // 학교가 없거나 일치하는 대상이 없으면, 잘못 적용될 위험이 있으므로 건너뛴다.
                                skippedAmbiguous.push(school ? `${name}(${school})` : `${name} (동명이인 ${globalCandidates.length}명, 학교정보 없음)`);
                                continue;
                            }

                            if (targets.length > 1) {
                                // 이름과 학교까지 같은 진짜 동명이인 -> 자동으로 구분할 방법이 없으므로
                                // 잘못된 사람에게 번호가 들어가는 것을 막기 위해 건너뛰고 수동 처리로 넘긴다.
                                skippedAmbiguous.push(`${name}(${school}) - 같은 학교에 동명이인 ${targets.length}명`);
                                continue;
                            }
                        }

                        if (targets.length > 0) {
                            targets.forEach(s => {
                                if (phone) s.phone = phone;
                                if (parentPhone) s.parentPhone = parentPhone;
                            });
                            matchedCount++;
                        } else {
                            notFoundNames.push(name);
                        }
                    }

                    renderFullApp(getCurrentActiveTeacher());
                    saveDataToSupabase('teacherDataStore', teacherDataStore);

                    let msg = `[전화번호 일괄 업데이트 완료]\n번호가 등록된 원생: ${matchedCount}명`;
                    if (notFoundNames.length > 0) {
                        msg += `\n일치하는 원생을 찾지 못함: ${notFoundNames.length}명`;
                        if (notFoundNames.length <= 15) {
                            msg += `\n(${notFoundNames.join(', ')})`;
                        }
                    }
                    if (skippedAmbiguous.length > 0) {
                        msg += `\n\n⚠️ 동명이인이라 안전하게 건너뜀 (학교 정보로 구분 필요): ${skippedAmbiguous.length}명`;
                        msg += `\n(${skippedAmbiguous.join(', ')})`;
                        msg += `\n→ 이 학생들은 원생 관리에서 직접 수정해주세요.`;
                    }
                    alert(msg);

                } catch (err) {
                    console.error(err);
                    alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
                } finally {
                    event.target.value = "";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function deleteManagementStudent(teacherName, index) {
            if (confirm("정말 이 원생을 목록에서 삭제하시겠습니까?")) {
                teacherDataStore[teacherName].students.splice(index, 1);
                renderFullApp(teacherName);
                saveDataToSupabase('teacherDataStore', teacherDataStore);
            }
        }

        function handleKakaoReservation() {
            const checkboxes = document.querySelectorAll('.recipient-checkbox:checked');
            const message = document.getElementById("kakao-msg-content").value.trim();
            const date = document.getElementById("reserve-date").value;
            const time = document.getElementById("reserve-time").value;

            if (checkboxes.length === 0) {
                alert("알림톡을 보낼 대상(학생/학부모)을 최소 1건 이상 체크해주세요.");
                return;
            }
            if (!message) {
                alert("전송할 메시지 내용을 입력해주세요.");
                return;
            }
            if (!date || !time) {
                alert("전송 예약 일시를 모두 선택해주세요.");
                return;
            }

            const typeLabel = { student: '학생', parent: '학부모' };
            let recipients = [];
            checkboxes.forEach(cb => {
                recipients.push({
                    name: cb.getAttribute('data-name'),
                    type: cb.getAttribute('data-type'),
                    phone: cb.getAttribute('data-phone') || ''
                });
            });

            const uniqueStudentNames = [...new Set(recipients.map(r => r.name))];
            const recipientSummary = recipients.map(r => `${r.name}(${typeLabel[r.type] || r.type})`).join(', ');

            globalReservations.push({
                id: Date.now(),
                teacher: getCurrentActiveTeacher(),
                studentCount: uniqueStudentNames.length,
                students: uniqueStudentNames,
                recipients: recipients,
                message: message,
                reserveAt: `${date} ${time}`,
                status: '대기중'
            });

            saveDataToSupabase('globalReservations', globalReservations);

            alert(`[전송 예약 완료]\n- 대상: ${recipients.length}건 (${recipientSummary})\n- 예약 일시: ${date} ${time}`);
            document.getElementById("kakao-msg-content").value = "";
            document.getElementById("reserve-date").value = "";
            document.getElementById("reserve-time").value = "";
            document.querySelectorAll('.recipient-checkbox').forEach(cb => cb.checked = false);
            updateSelectedCount();
        }

        function renderAdminReservations() {
            const container = document.getElementById("admin-reservation-list");
            container.innerHTML = "";

            let targetReservations = globalReservations;
            if (!isAdminLoggedIn) {
                const currentT = getCurrentActiveTeacher();
                targetReservations = globalReservations.filter(r => r.teacher === currentT);
            }

            if (targetReservations.length === 0) {
                container.innerHTML = '<div class="text-sm text-zinc-400 py-8 text-center">현재 접수된 전송 예약 내역이 없습니다.</div>';
                return;
            }

            targetReservations.forEach(res => {
                const typeLabel = { student: '학생', parent: '학부모' };
                const studentNamesStr = res.recipients && res.recipients.length > 0
                    ? res.recipients.map(r => `${r.name}(${typeLabel[r.type] || r.type})`).join(', ')
                    : (res.students ? res.students.join(', ') : '정보 없음');
                const targetCountLabel = res.recipients ? res.recipients.length : res.studentCount;
                
                let adminActionButtons = '';
                if (isAdminLoggedIn) {
                    adminActionButtons = `
                        <button onclick="updateReservationStatus(${res.id}, '전송완료')" class="px-3 py-1 bg-zinc-800 text-white rounded text-xs font-semibold hover:bg-zinc-900 transition">전송 완료로 처리</button>
                    `;
                }

                const item = document.createElement("div");
                item.className = "p-4 rounded-xl border border-zinc-200 bg-zinc-50/50 space-y-2";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="px-2.5 py-1 bg-primary/10 text-primary rounded-lg text-xs font-bold">${res.teacher}T</span>
                            <span class="text-xs text-zinc-600">대상: <b>${targetCountLabel}건</b> (<span class="text-zinc-500">${studentNamesStr}</span>)</span>
                            <span class="text-xs text-zinc-400">| ${res.reserveAt}</span>
                        </div>
                        <span class="px-2 py-0.5 text-xs rounded font-semibold ${res.status === '전송완료' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${res.status}</span>
                    </div>
                    <div class="p-3 bg-white rounded-lg border border-zinc-200 text-xs text-zinc-700 whitespace-pre-wrap">${res.message}</div>
                    <div class="flex justify-end space-x-2 pt-1">
                        ${adminActionButtons}
                        <button onclick="deleteReservation(${res.id})" class="px-3 py-1 bg-rose-100 text-rose-700 rounded text-xs font-semibold hover:bg-rose-200 transition">예약 취소</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateReservationStatus(id, newStatus) {
            const target = globalReservations.find(r => r.id === id);
            if(target) { 
                target.status = newStatus; 
                renderAdminReservations(); 
                saveDataToSupabase('globalReservations', globalReservations);
            }
        }

        function deleteReservation(id) {
            if(confirm("이 예약 내역을 취소하시겠습니까?")) {
                globalReservations = globalReservations.filter(r => r.id !== id);
                renderAdminReservations();
                saveDataToSupabase('globalReservations', globalReservations);
            }
        }

        function switchTab(tabName) {
            const attBtn = document.getElementById("tab-attendance-btn");
            const mngBtn = document.getElementById("tab-management-btn");
            const adminResBtn = document.getElementById("tab-admin-reservations-btn");
            
            const attSec = document.getElementById("tab-attendance");
            const mngSec = document.getElementById("tab-management");
            const adminResSec = document.getElementById("tab-admin-reservations");

            attBtn.className = "px-4 py-2 rounded-lg font-semibold text-zinc-600 hover:bg-zinc-100 transition";
            mngBtn.className = "px-4 py-2 rounded-lg font-semibold text-zinc-600 hover:bg-zinc-100 transition";
            if(adminResBtn) adminResBtn.className = "px-4 py-2 rounded-lg font-semibold text-zinc-600 hover:bg-zinc-100 transition";
            
            attSec.classList.add("hidden");
            mngSec.classList.add("hidden");
            if(adminResSec) adminResSec.classList.add("hidden");

            if (tabName === 'attendance') {
                attBtn.className = "px-4 py-2 rounded-lg font-semibold bg-primary text-white transition";
                attSec.classList.remove("hidden");
                const currentVal = getCurrentActiveTeacher();
                if(currentVal === "통합출석부") renderIntegratedTimetable();
                else renderTimetableAndSlots(currentVal);
            } else if (tabName === 'management') {
                mngBtn.className = "px-4 py-2 rounded-lg font-semibold bg-primary text-white transition";
                mngSec.classList.remove("hidden");
                renderManagementStudents(getCurrentActiveTeacher() === "통합출석부" ? "황성웅" : getCurrentActiveTeacher());
            } else if (tabName === 'admin-reservations') {
                adminResBtn.className = "px-4 py-2 rounded-lg font-semibold bg-primary text-white transition";
                adminResSec.classList.remove("hidden");
                renderAdminReservations();
            }
        }

        function addSlotBoxPrompt() {
            const currentTeacher = getCurrentActiveTeacher();
            if (currentTeacher === "통합출석부") return;

            const dayPrompt = prompt("어느 요일에 추가하시겠습니까? (금요일, 토요일, 일요일 중 입력):");
            if (!dayPrompt) return;
            let dayKey = dayPrompt.includes("금") ? "friday" : dayPrompt.includes("토") ? "saturday" : dayPrompt.includes("일") ? "sunday" : "";
            if (!dayKey) { alert("요일을 정확히 입력해주세요."); return; }
            addSlotBox(dayKey);
        }

        function addSlotBox(dayKey) {
            const currentTeacher = getCurrentActiveTeacher();
            if (currentTeacher === "통합출석부") return;

            const timeLabel = prompt("추가할 반 이름 및 시간대를 입력하세요 (예: 청람중1 (오후 2시 - 오후 5시)):");
            if (!timeLabel) return;

            if (!teacherDataStore[currentTeacher]) initDefaultTeacherData(currentTeacher);

            const newId = 'slot-' + dayKey + '-' + Date.now();
            teacherDataStore[currentTeacher].slots[dayKey].push({ id: newId, title: timeLabel });
            renderFullApp(currentTeacher);
            saveDataToSupabase('teacherDataStore', teacherDataStore);
        }

        function editSlotBox(teacherName, dayKey, slotId) {
            const data = teacherDataStore[teacherName];
            const slot = data.slots[dayKey].find(s => s.id === slotId);
            if (!slot) return;

            const action = prompt(`[${slot.title}] 시간대 박스 관리\n원하시는 작업을 입력하세요:\n1. 이름 수정\n2. 박스 삭제`, "1");
            
            if (action === "1" || action === "이름 수정") {
                const newTitle = prompt("변경할 반 이름 및 시간대를 입력하세요:", slot.title);
                if (newTitle && newTitle.trim() !== "") {
                    slot.title = newTitle.trim();
                    renderFullApp(teacherName);
                    saveDataToSupabase('teacherDataStore', teacherDataStore);
                }
            } else if (action === "2" || action === "박스 삭제") {
                if (confirm(`정말 "${slot.title}" 박스를 삭제하시겠습니까?\n이 시간대에만 등록된 학생은 목록에서 함께 해제되고, 다른 시간표에도 등록된 학생은 그 시간표에 그대로 남습니다.`)) {
                    data.slots[dayKey] = data.slots[dayKey].filter(s => s.id !== slotId);
                    data.students.forEach(s => {
                        const ids = getStudentSlotIds(s).filter(id => id !== slotId);
                        s.slotIds = ids;
                        delete s.slotId;
                    });
                    data.students = data.students.filter(s => s.slotIds.length > 0);
                    renderFullApp(teacherName);
                    saveDataToSupabase('teacherDataStore', teacherDataStore);
                }
            }
        }
    </script>
</body>
